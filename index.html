<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Manajemen User PBO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.header h1{
    font-size:32px;
    margin-bottom:5px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
    color:#444;
    margin-bottom:15px;
}

input,
select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#667eea;
}

button{
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.btn-login,
.btn-save{
    background:#667eea;
    color:white;
}

.btn-edit{
    background:#f39c12;
    color:white;
}

.btn-delete{
    background:#e74c3c;
    color:white;
}

.profile-box{
    display:flex;
    align-items:center;
    gap:20px;
}

.avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#667eea;
    color:white;
}

th,td{
    padding:14px;
    text-align:left;
}

tbody tr{
    border-bottom:1px solid #eee;
}

tbody tr:hover{
    background:#f8f9ff;
}

.role-admin{
    background:#e74c3c;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.role-user{
    background:#27ae60;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.hidden{
    display:none;
}

.info-box{
    margin-top:10px;
    background:#eef2ff;
    padding:12px;
    border-radius:10px;
}

.logout{
    background:#444;
    color:white;
    float:right;
}

@media(max-width:768px){

    .profile-box{
        flex-direction:column;
        text-align:center;
    }

    table{
        font-size:13px;
    }

    th,td{
        padding:8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>👨‍💻 Sistem Manajemen User</h1>
        <p>PBO CRUD | Inheritance | Local Storage</p>
    </div>

    <!-- LOGIN -->

    <div class="card" id="loginSection">

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button
            class="btn-login"
            onclick="login()">
            Login
        </button>

        <div class="info-box">
            <b>Demo Akun</b><br><br>

            Admin : admin / admin123<br>
            User : user / user123
        </div>

    </div>

    <!-- DASHBOARD -->

    <div id="dashboard" class="hidden">

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

        <br><br>

        <!-- PROFILE -->

        <div class="card">

            <h2>Profile User</h2>

            <div class="profile-box">

                <div class="avatar" id="avatarUser">
                    A
                </div>

                <div id="profileData"></div>

            </div>

        </div>

        <!-- CRUD FORM -->

        <div class="card" id="crudSection">

            <h2>Kelola Data User</h2>

            <input
                type="hidden"
                id="editIndex">

            <input
                type="text"
                id="nama"
                placeholder="Nama">

            <input
                type="email"
                id="email"
                placeholder="Email">

            <select id="role">
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>

            <button
                class="btn-save"
                onclick="saveUser()">
                Simpan Data
            </button>

        </div>

        <!-- TABLE -->

        <div class="card">

            <h2>Data User</h2>

            <table>

                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="userTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

/* =====================
   PBO - PEWARISAN
===================== */

class Person{

    constructor(nama,email){
        this.nama = nama;
        this.email = email;
    }

    getInfo(){
        return `${this.nama} - ${this.email}`;
    }
}

class User extends Person{

    constructor(nama,email,role){
        super(nama,email);
        this.role = role;
    }
}

/* =====================
   DATA DEMO
===================== */

if(!localStorage.getItem("users")){

    const demoUsers = [
        {
            nama:"Administrator",
            email:"admin@gmail.com",
            role:"Admin"
        },
        {
            nama:"User Demo",
            email:"user@gmail.com",
            role:"User"
        }
    ];

    localStorage.setItem(
        "users",
        JSON.stringify(demoUsers)
    );
}

/* =====================
   LOGIN DEMO
===================== */

const accounts = [

{
    username:"admin",
    password:"admin123",
    role:"Admin",
    nama:"Administrator"
},

{
    username:"user",
    password:"user123",
    role:"User",
    nama:"User Demo"
}

];

/* =====================
   LOGIN
===================== */

function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    const akun =
    accounts.find(a =>
        a.username===username &&
        a.password===password
    );

    if(akun){

        localStorage.setItem(
            "currentUser",
            JSON.stringify(akun)
        );

        showDashboard();

    }else{

        alert("Username atau Password salah!");
    }
}

/* =====================
   LOGOUT
===================== */

function logout(){

    localStorage.removeItem("currentUser");

    location.reload();
}

/* =====================
   TAMPIL DASHBOARD
===================== */

function showDashboard(){

    const currentUser =
    JSON.parse(
        localStorage.getItem("currentUser")
    );

    if(!currentUser) return;

    document
    .getElementById("loginSection")
    .classList.add("hidden");

    document
    .getElementById("dashboard")
    .classList.remove("hidden");

    document.getElementById(
        "avatarUser"
    ).innerHTML =
    currentUser.nama.charAt(0)
    .toUpperCase();

    document.getElementById(
        "profileData"
    ).innerHTML =
    `
    <p><b>Nama :</b> ${currentUser.nama}</p>
    <p><b>Role :</b> ${currentUser.role}</p>
    <p><b>Username :</b> ${currentUser.username}</p>
    `;

    if(currentUser.role==="User"){

        document.getElementById(
            "crudSection"
        ).style.display="none";
    }

    loadUsers();
}

/* =====================
   CRUD
===================== */

function getUsers(){

    return JSON.parse(
        localStorage.getItem("users")
    ) || [];
}

function saveLocal(users){

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );
}

function saveUser(){

    const nama =
    document.getElementById("nama").value;

    const email =
    document.getElementById("email").value;

    const role =
    document.getElementById("role").value;

    const index =
    document.getElementById("editIndex").value;

    const users =
    getUsers();

    const userBaru =
    new User(
        nama,
        email,
        role
    );

    if(index===""){

        users.push(userBaru);

    }else{

        users[index] = userBaru;
    }

    saveLocal(users);

    clearForm();

    loadUsers();
}

function loadUsers(){

    const users =
    getUsers();

    let rows = "";

    users.forEach((u,index)=>{

        const badge =
        u.role==="Admin"
        ?
        '<span class="role-admin">Admin</span>'
        :
        '<span class="role-user">User</span>';

        rows +=
        `
        <tr>
            <td>${index+1}</td>
            <td>${u.nama}</td>
            <td>${u.email}</td>
            <td>${badge}</td>
            <td>

                <button
                class="btn-edit"
                onclick="editUser(${index})">

                Edit

                </button>

                <button
                class="btn-delete"
                onclick="deleteUser(${index})">

                Hapus

                </button>

            </td>
        </tr>
        `;
    });

    document.getElementById(
        "userTable"
    ).innerHTML = rows;
}

function editUser(index){

    const users =
    getUsers();

    document.getElementById("nama").value =
    users[index].nama;

    document.getElementById("email").value =
    users[index].email;

    document.getElementById("role").value =
    users[index].role;

    document.getElementById("editIndex").value =
    index;
}

function deleteUser(index){

    if(confirm("Hapus data ini?")){

        const users =
        getUsers();

        users.splice(index,1);

        saveLocal(users);

        loadUsers();
    }
}

function clearForm(){

    document.getElementById("nama").value="";
    document.getElementById("email").value="";
    document.getElementById("role").value="User";
    document.getElementById("editIndex").value="";
}

/* =====================
   AUTO LOGIN
===================== */

showDashboard();

</script>

</body>
</html>
